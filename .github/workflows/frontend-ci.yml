name: Frontend CI

# kör bara när en PR ändrar nåt i frontend
on:
  pull_request:
    paths:
      - "frontend/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5   # installerar node
        with:
          node-version: "22"

      # npm ci istället för install, ändrar inte lock-filen
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
